<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amir SCP | Official Website</title>

    <meta name="description"
        content="وب‌سایت رسمی Amir SCP | گیمینگ، استریم و تولید محتوا">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #07070a;
            color: white;
            font-family: Arial, Tahoma, sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(168, 85, 247, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 30%,
                    rgba(236, 72, 153, 0.14),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 90%,
                    rgba(0, 229, 255, 0.10),
                    transparent 35%
                );

            pointer-events: none;
            z-index: -1;
        }

        /* NAVBAR */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    90deg,
                    #4c1d95,
                    #7c3aed,
                    #9333ea,
                    #7c3aed,
                    #4c1d95
                );

            background-size: 300% 100%;
            animation: navbarGlow 8s linear infinite;

            border-bottom: 2px solid rgba(255,255,255,0.15);

            box-shadow:
                0 8px 35px rgba(124,58,237,0.45);
        }

        .navbar h1 {
            font-size: clamp(25px, 4vw, 38px);
            font-weight: 1000;
            letter-spacing: 4px;

            text-shadow:
                3px 3px 0 #111,
                0 0 15px rgba(255,255,255,0.4);
        }

        @keyframes navbarGlow {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* HERO */

        .hero {
            min-height: calc(100vh - 78px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;
        }

        /* GRAFFITI */

        .graffiti {
            width: min(1150px, 95vw);
            min-height: 570px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            border-radius: 35px;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,0,128,0.95) 0 5%,
                    transparent 20%
                ),

                radial-gradient(
                    circle at 85% 15%,
                    rgba(0,229,255,0.9) 0 6%,
                    transparent 22%
                ),

                radial-gradient(
                    circle at 75% 85%,
                    rgba(124,58,237,0.9) 0 8%,
                    transparent 25%
                ),

                radial-gradient(
                    circle at 20% 85%,
                    rgba(34,197,94,0.8) 0 6%,
                    transparent 20%
                ),

                #15151b;

            border: 2px solid rgba(255,255,255,0.12);

            box-shadow:
                0 0 30px rgba(124,58,237,0.35),
                0 0 100px rgba(124,58,237,0.12),
                inset 0 0 100px rgba(0,0,0,0.8);
        }

        /* PAINT */

        .paint {
            position: absolute;
            border-radius: 999px;
            opacity: 0.85;
            filter: blur(1px);
            pointer-events: none;
        }

        .paint.one {
            width: 380px;
            height: 45px;
            background: #ff0080;
            transform: rotate(25deg);
            top: 70px;
            left: -100px;
            box-shadow: 0 0 25px #ff0080;
        }

        .paint.two {
            width: 420px;
            height: 50px;
            background: #00e5ff;
            transform: rotate(-20deg);
            bottom: 80px;
            right: -120px;
            box-shadow: 0 0 25px #00e5ff;
        }

        .paint.three {
            width: 260px;
            height: 38px;
            background: #facc15;
            transform: rotate(45deg);
            top: 45px;
            right: 100px;
            box-shadow: 0 0 25px #facc15;
        }

        .paint.four {
            width: 280px;
            height: 30px;
            background: #22c55e;
            transform: rotate(-35deg);
            bottom: 40px;
            left: 80px;
            box-shadow: 0 0 25px #22c55e;
        }

        /* CONTENT */

        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 30px;
        }

        .small-title {
            font-size: 18px;
            color: #d8b4fe;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .graffiti-title {
            font-size: clamp(60px, 12vw, 155px);

            font-weight: 1000;
            line-height: 0.95;
            letter-spacing: 5px;
            color: white;

            transform: rotate(-4deg);

            text-shadow:
                8px 8px 0 #ff0080,
                -7px -7px 0 #00e5ff,
                14px 17px 0 #000,
                0 0 35px rgba(255,255,255,0.25);
        }

        .subtitle {
            margin-top: 35px;

            font-size: clamp(16px, 3vw, 24px);

            color: #e5e7eb;

            text-shadow:
                0 0 15px rgba(255,255,255,0.2);
        }

        /* BUTTONS */

        .buttons {
            margin-top: 35px;

            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 15px;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 170px;

            padding: 14px 24px;

            border-radius: 999px;

            color: white;
            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.18);

            backdrop-filter: blur(10px);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .button:hover {
            transform: translateY(-5px) scale(1.03);

            background: rgba(124,58,237,0.5);

            box-shadow:
                0 10px 30px rgba(124,58,237,0.45);
        }

        /* UPDATE */

        .update-text {
            margin-top: 25px;

            font-size: 15px;

            color: #c4b5fd;

            opacity: 0.9;
        }

        /* FOOTER */

        footer {
            text-align: center;

            padding: 25px 15px;

            color: #9ca3af;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                height: 70px;
            }

            .graffiti {
                min-height: 500px;
                width: 94vw;
                border-radius: 25px;
            }

            .graffiti-title {
                font-size: 58px;
                letter-spacing: 2px;
            }

            .paint.one {
                width: 250px;
            }

            .paint.two {
                width: 270px;
            }

            .buttons {
                flex-direction: column;
                align-items: center;
            }

            .button {
                width: 220px;
            }
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <h1>
            Amir SCP
        </h1>

    </header>


    <!-- HERO -->

    <main class="hero">

        <section class="graffiti">

            <div class="paint one"></div>
            <div class="paint two"></div>
            <div class="paint three"></div>
            <div class="paint four"></div>

            <div class="content">

                <div class="small-title">
                    OFFICIAL WEBSITE
                </div>

                <div class="graffiti-title">
                    AMIR SCP
                </div>

                <p class="subtitle">
                    🎮 گیمینگ • 🎥 استریم • 🚀 تولید محتوا
                </p>

                <div class="buttons">

                    <!-- آپارات -->

                    <a
                        class="button"
                        href="https://www.aparat.com/Amir.Mahdi.SCP"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        🎬 آپارات
                    </a>


                    <!-- یوتیوب -->

                    <a
                        class="button"
                        href="https://www.youtube.com/@Amir_Mahdi_SCP"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ▶️ یوتیوب
                    </a>


                    <!-- اینستاگرام -->

                    <a
                        class="button"
                        href="https://www.instagram.com/amir_scp.ir"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        📸 اینستاگرام
                    </a>


                    <!-- تلگرام -->

                    <a
                        class="button"
                        href="https://t.me/Amir_Mahdi_SCP"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ✈️ تلگرام
                    </a>

                </div>

                <p class="update-text">
                    🔥 به دنیای Amir SCP خوش آمدید!
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        © 2026 Amir SCP
        <br>
        تمامی حقوق محفوظ است.

    </footer>

</body>

</html>
